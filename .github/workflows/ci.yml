name: CI

# Replays migrations and real-DB tests on disposable PostgreSQL.
on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".env.example"
      - ".gitattributes"
      - ".githooks/**"
      - ".github/**"
      - ".gitignore"
      - ".gitleaks.toml"
      - ".npmrc"
      - ".nvmrc"
      - "apps/db/**"
      - "apps/engine/**"
      - "bun.lock"
      - "contracts/**"
      - "package.json"
      - "patches/**"
      - "scripts/**"
      - "turbo.json"
      - ".bun-version"
      - ".python-version"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/db

env:
  COLUMNS: "200"

jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py
        with:
          working-directory: apps/engine

      - name: Run engine tests
        run: uv run --locked pytest

      - name: Check product code for provider names
        run: uv run --locked pytest --noconftest ../db/tests/test_no_provider_names.py

      - name: Ruff
        run: uv run --locked ruff check src tests

      - name: Strict Python typing
        run: uv run --locked mypy

  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      run_db: ${{ steps.classify.outputs.run_db }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Test DB path selection
        run: node --test .github/scripts/ci-paths.test.mjs

      - name: Run Worker routing tests
        run: node --test apps/engine/test/*.test.mjs

      - name: Classify DB paths
        id: classify
        run: node .github/scripts/ci-paths.mjs classify

  offline-tests-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Run offline test shard
        env:
          DB_TEST_SHARD: ${{ matrix.shard }}
        run: uv run python ../../.github/scripts/db_test_shards.py offline "$DB_TEST_SHARD"

  db-quality-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Ruff
        run: uv run ruff check src tests

      - name: Strict Python typing
        run: uv run mypy

      - name: Verify runtime container toolchain
        run: bash scripts/verify-runtime-images.sh
        working-directory: apps/db

  # Require one Alembic head so empty-DB replay and production init-db can succeed.
  alembic-single-head-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Assert a single alembic head
        run: |
          heads="$(uv run alembic heads 2>/dev/null | grep -c '(head)' || true)"
          echo "alembic heads reporting (head): ${heads}"
          if [ "${heads}" != "1" ]; then
            echo "::error::Expected exactly one alembic head, found ${heads}." >&2
            uv run alembic heads
            exit 1
          fi

  real-db-tests-work:
    needs: [classify]
    if: ${{ needs.classify.outputs.run_db == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: transit_ci
          POSTGRES_PASSWORD: transit_ci
          POSTGRES_DB: transit_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U transit_ci -d transit_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://transit_ci:transit_ci@127.0.0.1:5432/transit_ci
      TRANSIT_TEST_DATABASE_URL: postgresql+psycopg://transit_ci:transit_ci@127.0.0.1:5432/transit_ci
      TRANSIT_TEST_DATABASE_DISPOSABLE: I_UNDERSTAND_THIS_DATABASE_IS_DISPOSABLE
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python workspace
        uses: ./.github/actions/setup-py

      - name: Replay migrations on disposable PostgreSQL
        run: |
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGSERVICE PGSERVICEFILE
          uv run alembic upgrade head
        working-directory: apps/db

      - name: Run real-DB test shard
        env:
          DB_TEST_SHARD: ${{ matrix.shard }}
        run: |
          unset PGHOST PGHOSTADDR PGPORT PGDATABASE PGUSER PGSERVICE PGSERVICEFILE
          uv run python ../../.github/scripts/db_test_shards.py real-db "$DB_TEST_SHARD" \
            -n 4 --dist worksteal --max-worker-restart=0 --durations=20 -rs --junitxml=real-db-junit.xml
        working-directory: apps/db

      - name: Upload real-DB test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-db-junit-${{ matrix.shard }}
          path: apps/db/real-db-junit.xml
          retention-days: 14
          if-no-files-found: warn

  required-contexts:
    needs:
      [
        classify,
        offline-tests-work,
        db-quality-work,
        alembic-single-head-work,
        real-db-tests-work,
      ]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: offline-tests
          - context: alembic-single-head
          - context: real-db-tests
    name: ${{ matrix.context }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Require selected DB checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-paths.mjs required
