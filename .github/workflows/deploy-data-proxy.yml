name: Deploy Data Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - "apps/data-proxy/**"
      - ".bun-version"
      - ".nvmrc"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/deploy-data-proxy.yml"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: deploy-data-proxy
  cancel-in-progress: false

jobs:
  test-data-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/data-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Run worker behavioral suite
        run: node --test "test/*.test.mjs"

  deploy-data-proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test-data-proxy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: transit-data-edge-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/data-proxy
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Deploy worker with wrangler
        run: |
          set -euo pipefail
          umask 077
          proxy_secrets="$(mktemp "$RUNNER_TEMP/proxy-secrets.XXXXXX.json")"
          trap 'rm -f "$proxy_secrets"' EXIT
          node --input-type=module - "$proxy_secrets" <<'JS'
          import { writeFileSync } from 'node:fs';

          const names = ['TRANSIT1_ENGINE_ACCESS_TOKEN', 'TRANSIT1_R2_ENDPOINT',
            'TRANSIT1_R2_READ_ACCESS_KEY_ID', 'TRANSIT1_R2_READ_SECRET_ACCESS_KEY'];
          const secrets = Object.fromEntries(names.map((name) => {
            if (!process.env[name]) throw new Error(`Missing deployment secret ${name}`);
            return [name, process.env[name]];
          }));
          writeFileSync(process.argv[2], JSON.stringify(secrets));
          JS
          ../../node_modules/.bin/wrangler deploy --secrets-file "$proxy_secrets"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TRANSIT1_ENGINE_ACCESS_TOKEN: ${{ secrets.TRANSIT1_ENGINE_ACCESS_TOKEN }}
          TRANSIT1_R2_ENDPOINT: ${{ secrets.TRANSIT1_R2_ENDPOINT }}
          TRANSIT1_R2_READ_ACCESS_KEY_ID: ${{ secrets.TRANSIT1_R2_READ_ACCESS_KEY_ID }}
          TRANSIT1_R2_READ_SECRET_ACCESS_KEY: ${{ secrets.TRANSIT1_R2_READ_SECRET_ACCESS_KEY }}

      - name: Apply public snapshot CORS
        run: ../../node_modules/.bin/wrangler r2 bucket cors set transit-snapshots --file r2-cors.json --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure direct R2 edge caching
        run: node scripts/configure-data-edge.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: 8a4ad7999bd6c2259b5b4acd52f39015

      - name: Run production smoke
        run: bash smoke.sh
