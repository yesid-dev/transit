name: Clean service days

on:
  schedule:
    # Backup catch-up after the VM's afternoon and midnight runs. Scheduled
    # and manual runs use the same R2 provider-day lock as the VM.
    - cron: "13 19 * * *"
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider ID (leave blank for public providers). Private runs keep their output out of the log.
        type: string
        required: false
      from:
        description: First service date (YYYY-MM-DD, inclusive)
        type: string
        required: true
      to:
        description: Last service date (YYYY-MM-DD, inclusive)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: clean-days
  cancel-in-progress: false

env:
  UV_MANAGED_PYTHON: "1"

defaults:
  run:
    working-directory: apps/db

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.days.outputs.matrix }}
      scheduled_at: ${{ steps.days.outputs.scheduled_at }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python workspace
        uses: ./.github/actions/setup-py
      - name: Select provider days
        id: days
        env:
          CLEAN_PROVIDER: ${{ inputs.provider }}
          CLEAN_FROM: ${{ inputs.from }}
          CLEAN_TO: ${{ inputs.to }}
        run: uv run --managed-python --locked python -m transit_ops.clean_days_plan

  clean:
    # A private city's job title, log and summary carry no figures or provider name.
    name: Clean ${{ matrix.private && 'private city' || matrix.provider }} ${{ matrix.day || 'catch-up' }}
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python workspace
        uses: ./.github/actions/setup-py
      - name: Build and publish clean days
        env:
          CLEAN_PRIVATE: ${{ matrix.private }}
          CLEAN_PROVIDER: ${{ matrix.provider }}
          CLEAN_DAY: ${{ matrix.day }}
          CLEAN_SCHEDULED_AT: ${{ needs.plan.outputs.scheduled_at }}
          CLEAN_SOURCE_S3_ENDPOINT: ${{ secrets.TRANSIT1_R2_ENDPOINT }}
          CLEAN_SOURCE_S3_ACCESS_KEY_ID: ${{ secrets.TRANSIT1_R2_READ_ACCESS_KEY_ID }}
          CLEAN_SOURCE_S3_SECRET_ACCESS_KEY: ${{ secrets.TRANSIT1_R2_READ_SECRET_ACCESS_KEY }}
          CLEAN_DEST_S3_ENDPOINT: ${{ secrets.TRANSIT1_R2_ENDPOINT }}
          CLEAN_DEST_S3_ACCESS_KEY_ID: ${{ secrets.TRANSIT1_R2_WRITE_ACCESS_KEY_ID }}
          CLEAN_DEST_S3_SECRET_ACCESS_KEY: ${{ secrets.TRANSIT1_R2_WRITE_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            args=(--from "$CLEAN_DAY" --to "$CLEAN_DAY")
          else
            args=(--scheduled-at "$CLEAN_SCHEDULED_AT")
          fi
          if [[ "$CLEAN_PRIVATE" == "true" ]]; then
            # Only the exit status of a private city is public. Diagnose a failure on the
            # VM with apps/db/ops/linux/private-clean-day.sh, never by restoring output here.
            exec > /dev/null 2>&1
          else
            args+=(--summary "$GITHUB_STEP_SUMMARY")
          fi
          uv run --managed-python --locked transit-ops clean-days --provider "$CLEAN_PROVIDER" \
            "${args[@]}" --source s3://transit-raw --dest s3://transit-clean
