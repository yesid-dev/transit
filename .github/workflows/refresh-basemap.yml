name: Refresh Basemap Extract


on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC, 1st of each month
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider id; blank refreshes publicly ready providers"
        type: string
        required: false
      planet_build:
        description: "Protomaps build YYYYMMDD; blank uses yesterday (pin to reproduce poster receipts)"
        type: string
        required: false
      copy_current:
        description: "Copy the current basemap to clean storage without rebuilding or replacing the source"
        type: boolean
        default: false
      plan_only:
        description: "Print the declaration's extract extent without contacting tile sources or storage"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-basemap
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.30.3"
  MAXZOOM: "15"
  R2_BUCKET: "transit-snapshots"

jobs:
  providers:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-py
      - id: config
        working-directory: apps/db
        env:
          REQUESTED_PROVIDER: ${{ inputs.provider }}
          PLAN_ONLY: ${{ inputs.plan_only }}
          COPY_CURRENT: ${{ inputs.copy_current }}
        run: |
          args=(--provider "$REQUESTED_PROVIDER")
          if [[ "$PLAN_ONLY" == true ]]; then
            [[ "$COPY_CURRENT" != true ]] || { echo "Choose either plan_only or copy_current" >&2; exit 1; }
            args+=(--plan-only)
          elif [[ "$COPY_CURRENT" == true ]]; then
            args+=(--copy-current)
          fi
          matrix="$(uv run --managed-python --locked python -m transit_ops.providers.basemap_plan "${args[@]}")"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$PLAN_ONLY" == true ]]; then
            printf '### Basemap extract plan (maximum zoom %s)\n\n```json\n%s\n```\n' \
              "$MAXZOOM" "$matrix" >> "$GITHUB_STEP_SUMMARY"
          fi

  refresh-basemap:
    needs: providers
    if: ${{ !inputs.plan_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
    env:
      BBOX: ${{ matrix.bbox }}
      CITY: ${{ matrix.provider }}
      R2_KEY: ${{ matrix.key }}
      EXTRACT_FILE: ${{ matrix.file }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install go-pmtiles
        if: ${{ !inputs.copy_current }}
        run: |
          curl -sSfL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" -o /tmp/go-pmtiles.tar.gz
          echo "adda9f979b719416d0c0069f57401a21c32078c46870a94f9bbda95d850f199f  /tmp/go-pmtiles.tar.gz" | sha256sum -c -
          tar -xzf /tmp/go-pmtiles.tar.gz pmtiles
          sudo mv pmtiles /usr/local/bin/
          pmtiles version

      - name: Extract provider area from the latest Protomaps daily build
        if: ${{ !inputs.copy_current }}
        env:
          PLANET_BUILD: ${{ inputs.planet_build }}
        run: |
          DATE="${PLANET_BUILD:-$(date -u -d 'yesterday' +%Y%m%d)}"
          [[ "${DATE}" =~ ^[0-9]{8}$ ]] || { echo "Invalid planet build" >&2; exit 1; }
          SRC="https://build.protomaps.com/${DATE}.pmtiles"
          echo "Extracting bbox=${BBOX} maxzoom=${MAXZOOM} from ${SRC}"
          timeout 5m pmtiles extract "${SRC}" "${EXTRACT_FILE}" --bbox="${BBOX}" --maxzoom="${MAXZOOM}"

      - name: Verify the extract (fail loudly on regress)
        if: ${{ !inputs.copy_current }}
        run: |
          timeout 2m pmtiles verify "${EXTRACT_FILE}"
          timeout 2m pmtiles show "${EXTRACT_FILE}"
          SIZE="$(stat -c%s "${EXTRACT_FILE}")"
          echo "extract size: ${SIZE} bytes"
          test "${SIZE}" -gt 100000

      - name: Set up JS workspace
        uses: ./.github/actions/setup

      - name: Replace the stable R2 object with verified backup and readback
        # A clean-only city (basemap_legacy: false) never touches the legacy public bucket.
        if: ${{ !inputs.copy_current && matrix.legacy }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: eccfb9bedd87d413eaf4cac6ae2285d3
          WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
        run: |
          BACKUP_KEY="${R2_KEY%/*}/backups/${EXTRACT_FILE%.pmtiles}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-before.pmtiles"
          bun .github/scripts/refresh-basemap-r2.mjs \
            --bucket="${R2_BUCKET}" \
            --key="${R2_KEY}" \
            --backup-key="${BACKUP_KEY}" \
            --new-file="${EXTRACT_FILE}" \
            --receipt="${RUNNER_TEMP}/basemap-refresh-receipt.json"
          cat "${RUNNER_TEMP}/basemap-refresh-receipt.json"

      - name: Read the current legacy basemap
        if: ${{ inputs.copy_current }}
        run: |
          curl --fail --silent --show-error --max-time 180 \
            --dump-header "${RUNNER_TEMP}/basemap-source.headers" \
            --output "${EXTRACT_FILE}" "https://transit.yesid.dev/data/${R2_KEY}"

      - name: Upload the clean basemap and verify its readback
        env:
          CLEAN_ENDPOINT: ${{ secrets.TRANSIT1_R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TRANSIT1_R2_WRITE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRANSIT1_R2_WRITE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        run: |
          set -euo pipefail
          CLEAN_KEY="$(node --input-type=module -e '
            import { basemapKey } from "./apps/data-proxy/src/basemap.js";
            console.log(basemapKey(...process.argv.slice(1)));
          ' "${CITY}" "${EXTRACT_FILE}")"
          SIZE="$(stat -c%s "${EXTRACT_FILE}")"
          test "${SIZE}" -gt 0
          SHA256="$(sha256sum < "${EXTRACT_FILE}" | cut -d' ' -f1)"
          ETAG="\"$(md5sum < "${EXTRACT_FILE}" | cut -d' ' -f1)\""
          MD5="$(openssl dgst -md5 -binary "${EXTRACT_FILE}" | openssl base64 -A)"

          # The refresh sets only Content-Type. Copy mode also retains legacy HTTP metadata.
          metadata=(--content-type application/octet-stream)
          headers="${RUNNER_TEMP}/basemap-source.headers"
          if [[ -f "${headers}" ]]; then
            metadata=()
            source_etag=""
            while IFS= read -r header; do
              name="${header%%:*}"
              value="${header#*: }"
              value="${value%$'\r'}"
              case "${name,,}" in
                cache-control|content-type|content-disposition|content-encoding|content-language|expires)
                  metadata+=("--${name,,}" "${value}") ;;
                etag) source_etag="${value}" ;;
              esac
            done < "${headers}"
            test "${source_etag}" = "${ETAG}"
          fi

          # A single PUT preserves the content-derived ETag used by the legacy archive.
          target=(--endpoint-url "${CLEAN_ENDPOINT}" --bucket transit-clean --key "${CLEAN_KEY}")
          aws s3api put-object "${target[@]}" --body "${EXTRACT_FILE}" \
            --content-md5 "${MD5}" "${metadata[@]}" > /dev/null
          readback="${RUNNER_TEMP}/basemap-clean-readback.pmtiles"
          clean_etag="$(aws s3api get-object "${target[@]}" --query ETag --output text "${readback}")"
          test "${clean_etag}" = "${ETAG}"
          test "$(stat -c%s "${readback}")" = "${SIZE}"
          test "$(sha256sum < "${readback}" | cut -d' ' -f1)" = "${SHA256}"
          printf 'Verified %s: %s bytes, SHA-256 %s\n' "${CLEAN_KEY}" "${SIZE}" "${SHA256}"
