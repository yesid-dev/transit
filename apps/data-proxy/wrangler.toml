name = "transit-data-proxy"
main = "src/entrypoint.js"
compatibility_date = "2026-06-10"
compatibility_flags = ["enable_request_signal"]
account_id = "eccfb9bedd87d413eaf4cac6ae2285d3"
workers_dev = false

routes = [
  { pattern = "transit.yesid.dev/data/*", zone_name = "yesid.dev" },
  { pattern = "transit.yesid.dev/api/v1/*", zone_name = "yesid.dev" },
  { pattern = "data.yesid.dev/v2/*", zone_name = "yesid.dev" },
]

[build]
command = "bun scripts/build-public-cities.mjs"
watch_dir = ["../db/config/providers", "scripts"]

[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "transit-snapshots"

[[services]]
binding = "ENGINE"
service = "transit-engine"

# Wrangler provisions and reuses the dedicated namespace on deployment.
[[kv_namespaces]]
binding = "QUESTION_LAST_GOOD"

[[ratelimits]]
name = "QUESTION_LIMIT"
namespace_id = "25261122"
# Sized for pages, not questions. A Line record is the largest page at 16 questions. A rider who
# opens three lines in a minute and looks at each on a second period asks 6 x 16 = 96; four more
# cover the catalog, timetable and source-date reads. Answers already kept never count.
simple = { limit = 100, period = 60 }

[observability]
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false
