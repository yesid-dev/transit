# The new Worker is the origin. Cloudflare provisions DNS and TLS for its Custom Domain.
name = "transit1-web"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "eccfb9bedd87d413eaf4cac6ae2285d3"
workers_dev = false
# PR version URLs remain available on workers.dev.
preview_urls = true

routes = [{ pattern = "transit1.yesid.dev", custom_domain = true }]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[services]]
binding = "QUESTION_PROXY"
service = "transit-data-proxy"
entrypoint = "Questions"

[vars]
PUBLIC_SITE_ORIGIN = "https://transit1.yesid.dev"
PUBLIC_INDEXING = "false"
PUBLIC_PLAUSIBLE_DOMAIN = ""
PUBLIC_CF_BEACON_TOKEN = ""
PUBLIC_VITALS_ENABLED = ""
# Default-provider SEO identity when the selected city is unavailable.
PUBLIC_PROVIDER_SHORT_NAME = "STM"
PUBLIC_PROVIDER_CITY = "Montréal"
# Social / authorship identity for the document head (Twitter card + author meta).
# AUTHOR is the human byline; the @handles drive twitter:site / twitter:creator.
# Leave a handle empty to omit that tag gracefully (no empty meta is emitted).
PUBLIC_SITE_AUTHOR = "Yesid"
PUBLIC_TWITTER_SITE = ""
PUBLIC_TWITTER_CREATOR = ""

# Persist errors without request invocation records or query-string metadata.
[observability]
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[observability.issues]
enabled = false
