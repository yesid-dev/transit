<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex" />
		<meta name="color-scheme" content="light dark" />
		<title>Offline · Transit</title>
		<link rel="icon" href="/favicon.svg" />
		<style>
			/* The offline page must render without fetching styles or fonts. */
			:root {
				color-scheme: light dark;
				--background: #141414;
				--card: #1a1a1a;
				--foreground: #f5f5f0;
				--muted-foreground: #949494;
				--border: #3a3a3a;
				--primary: #e07800;
				--amber: #d9a300;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--background: #f5f5f0;
					--card: #fff;
					--foreground: #141414;
					--muted-foreground: #525252;
					--border: #d0d0cc;
				}
			}
			[lang="en"] [lang="fr"], [lang="fr"] [lang="en"] { display: none; }
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				min-height: 100%;
			}
			body {
				background: var(--background);
				color: var(--foreground);
				font-family:
					'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 1.5rem;
				min-height: 100dvh;
				-webkit-font-smoothing: antialiased;
			}
			.panel {
				width: 100%;
				max-width: 30rem;
				background: var(--card);
				border: 1px solid var(--border);
				border-radius: 0.75rem;
				padding: 2rem;
				text-align: left;
			}
			h1 {
				font-size: 1.35rem;
				line-height: 1.25;
				margin: 1rem 0 0.5rem;
			}
			p {
				color: var(--muted-foreground);
				font-size: 0.95rem;
				line-height: 1.55;
				margin: 0 0 0.5rem;
			}
			.actions {
				margin-top: 1.5rem;
			}
			.actions a {
				display: inline-block;
				font-weight: 600;
				color: #141414;
				background: var(--primary);
				border-radius: 0.5rem;
				padding: 0.65rem 1.1rem;
				text-decoration: none;
			}
			.actions a:hover {
				background: #c96a00;
			}
		</style>
		<script>
			const french = /^\/fr(?:\/|$)/.test(location.pathname) || /^fr(?:-|$)/i.test(navigator.language);
			if (french) {
				document.documentElement.lang = "fr";
				document.title = "Hors ligne · Transit";
			}
		</script>
	</head>
	<body>
		<main class="panel">
			<div lang="en">
				<h1>You are offline</h1>
				<p>Transit needs a connection to show live vehicles and the service record. Reconnect, then try again.</p>
				<div class="actions"><a href="">Try again</a></div>
			</div>
			<div lang="fr">
				<h1>Vous êtes hors ligne</h1>
				<p>Transit a besoin d’une connexion pour afficher les véhicules en direct et le bilan du service. Reconnectez-vous, puis réessayez.</p>
				<div class="actions"><a href="">Réessayer</a></div>
			</div>
		</main>
	</body>
</html>
