<!doctype html>
<html lang="%lang%" data-theme="dark" data-density="compact">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		%yesid.themeBoot% %yesid.announcementBannerBoot%
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon-180.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Transit" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<aside
			id="app-reload-notice"
			data-version="%transit.appVersion%"
			data-version-url="%sveltekit.assets%/_app/version.json"
			class="fixed inset-x-3 bottom-3 z-[200] mx-auto max-w-sm rounded-md border border-border bg-background p-3 text-foreground shadow-lg"
			hidden
		>
			<span data-reload-message role="status"></span>
			<button type="button" class="ml-2 min-h-11 rounded-md px-3 font-semibold underline">
				Reload
			</button>
		</aside>
		%transit.reloadBoot%
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
