# ─────────────────────────────────────────────────────────────────────────────
# STO, Société de transport de l'Outaouais (Gatineau, QC)
#
# Do not activate until STO confirms that its terms cover historical capture
# retention and public downloads of cleaned and derived tables.
#
# Geometry ships in shapes.txt, with no separate GIS bundle.
#
# RT auth (API v1.1, pp. 2 to 4):
#   https://m.sto.ca/site/assets/files/1533/documentation_dev_gtfsrt.pdf
#   Each realtime request carries TWO query params:
#     key=<STO_PUBLIC_KEY>
#     hash=SHA256( STO_PRIVATE_KEY + <UTC yyyymmddTHHMMZ> )  (recomputed per minute)
#   The hash uses uppercase hexadecimal.
#   Synchronize the worker clock with NTP. Clock drift can cause a 401.
#
# Provision STO_PUBLIC_KEY and STO_PRIVATE_KEY securely at deploy time; never
# inline either value here.
#
# ─────────────────────────────────────────────────────────────────────────────

provider:
  provider_id: sto
  display_name: Société de transport de l'Outaouais
  short_name: STO
  city: Gatineau
  timezone: America/Toronto
  default_language: fr
  default_currency: CAD
  bounds:
    # Includes cross-river stops in Ottawa.
    min_latitude: 45.35
    max_latitude: 45.63
    min_longitude: -75.95
    max_longitude: -75.35
  attribution_text: "This service incorporates the open data provided by the Société de transport de l'Outaouais (STO)."
  website_url: https://www.sto.ca/
  is_active: false

public:
  enabled: false
  labels:
    en: {city: Gatineau, operator: STO}
    fr: {city: Gatineau, operator: STO}
  fit_bounds:
    min_longitude: -75.93
    min_latitude: 45.36
    max_longitude: -75.36
    max_latitude: 45.62
  max_bounds:
    min_longitude: -76.25
    min_latitude: 45.30
    max_longitude: -75.23
    max_latitude: 45.75
  geocode_context: Gatineau, Québec
  # Terms reviewed. Written confirmation for retention and derived downloads is pending.
  download_licence:
    checked_on: "2026-11-24"
    name:
      en: "Terms of Use for STO's Open Data and API Key"
      fr: "Conditions d'utilisation des données ouvertes et de la clé API de la STO"
    source_date_required: true
    attribution:
      en: "This service incorporates the open data provided by the Société de transport de l'Outaouais (STO). The STO is not responsible for the accuracy of the information generated by this app. Last update: {source_date}."
      fr: "Le présent service intègre les données ouvertes fournies par la Société de transport de l'Outaouais (STO). La STO n'est pas responsable de l'exactitude de l'information générée par cette application. Dernière mise à jour : {source_date}."
    url:
      en: https://www.sto.ca/en/business/developer-space-open-data/terms-of-use-stos-open-data-and-api-key/
      fr: https://www.sto.ca/affaires/espace-developpeurs-donnees-ouvertes/conditions-dutilisation-donnees-ouvertes-et-cle-api-de-la-sto/
    limits:
      en: "The STO grants limited, revocable, non-exclusive rights to use, reproduce and redistribute its open data. The terms require using the data as supplied for integration. The STO provides the data without warranty."
      fr: "La STO accorde des droits limités, révocables et non exclusifs d’utilisation, de reproduction et de redistribution de ses données ouvertes. Les conditions exigent l’utilisation des données telles que fournies pour leur intégration. La STO fournit les données sans garantie."
    non_endorsement:
      en: "Displaying the data must not imply sponsorship by, affiliation with or association with the STO."
      fr: "L’affichage des données ne doit pas donner l’impression d’un parrainage, d’une affiliation ou d’une association avec la STO."
    source: {en: "the STO", fr: "de la STO"}

feeds:
  static_schedule:
    endpoint_key: static_schedule
    feed_kind: static_schedule
    source_format: gtfs_schedule_zip
    source_url: https://contenu.sto.ca/GTFS/GTFS.zip
    source_url_env_var: STO_STATIC_GTFS_URL
    documentation_url: https://www.sto.ca/en/business/developer-space-open-data/
    auth:
      auth_type: none
      notes: Keyless static GTFS, refreshed every 24 hours. Geometry is in shapes.txt.
    refresh_interval_seconds: 86400
    is_enabled: true

  trip_updates:
    endpoint_key: trip_updates
    feed_kind: trip_updates
    source_format: gtfs_rt_trip_updates
    source_url: https://gtfs.sto.ca/download.php?file=trip&stream=standard
    source_url_env_var: STO_RT_TRIP_UPDATES_URL
    documentation_url: https://www.sto.ca/en/business/developer-space-open-data/
    auth:
      auth_type: api_key_signed
      credential_env_var: STO_PUBLIC_KEY
      auth_query_param: key
      signing_secret_env_var: STO_PRIVATE_KEY
      signature_query_param: hash
      signature_scheme: sha256_utc_minute_upper
      notes: key=<STO_PUBLIC_KEY> + hash=SHA256(STO_PRIVATE_KEY + UTC yyyymmddTHHMMZ), recomputed per minute. Worker host must run NTP.
    refresh_interval_seconds: 30
    is_enabled: true

  vehicle_positions:
    endpoint_key: vehicle_positions
    feed_kind: vehicle_positions
    source_format: gtfs_rt_vehicle_positions
    source_url: https://gtfs.sto.ca/download.php?file=vehicule
    source_url_env_var: STO_RT_VEHICLE_POSITIONS_URL
    documentation_url: https://www.sto.ca/en/business/developer-space-open-data/
    auth:
      auth_type: api_key_signed
      credential_env_var: STO_PUBLIC_KEY
      auth_query_param: key
      signing_secret_env_var: STO_PRIVATE_KEY
      signature_query_param: hash
      signature_scheme: sha256_utc_minute_upper
      notes: Same key+hash scheme as trip_updates. STO names the vehicle file with the French spelling (file=vehicule).
    refresh_interval_seconds: 30
    is_enabled: true

  service_alerts:
    endpoint_key: service_alerts
    feed_kind: service_alerts
    source_format: gtfs_rt_service_alerts
    source_url: https://gtfs.sto.ca/download.php?file=alert
    source_url_env_var: STO_SERVICE_ALERTS_URL
    documentation_url: https://www.sto.ca/en/business/developer-space-open-data/
    auth:
      auth_type: api_key_signed
      credential_env_var: STO_PUBLIC_KEY
      auth_query_param: key
      signing_secret_env_var: STO_PRIVATE_KEY
      signature_query_param: hash
      signature_scheme: sha256_utc_minute_upper
      notes: Standard GTFS-RT Alert.pb. Same key+hash scheme. Ingested by the generic service_alerts ingester.
    refresh_interval_seconds: 300
    is_enabled: true

realtime:
  lines_without_live_data: []
