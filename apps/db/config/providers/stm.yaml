declaration: 2
id: stm
name: Société de transport de Montréal
labels:
  en: {city: Montréal, operator: STM}
  fr: {city: Montréal, operator: STM}
timezone: America/Toronto
default_locale: fr
feed_languages: [fr, en]
website: https://www.stm.info/
currency: CAD
stage: public
licence:
  name: CC BY 4.0
  terms_url: https://beta.stm.info/a-propos/documents-donnees/donnees-ouvertes
  review: accepted
attribution:
  fr: Contains STM data made available under CC BY 4.0.
reading_population: vehicle_evidence
live_source_lag_seconds: 0

feeds:
  - family: schedule
    format: gtfs
    url: https://beta.stm.info/getContentAsset/38dcb679-4237-4c02-b6f4-5f8434665e5c/dfc3d011-8f63-43f6-9ed8-4b444333a1d0/GTFS_STM.zip?language=fr
    url_env: STM_STATIC_GTFS_URL
    every_seconds: 86400
  - family: geometry
    format: stm-gis-zip
    url: https://beta.stm.info/getContentAsset/3023ab97-ecd3-4b5e-ab25-16c90fe0bdd1/dfc3d011-8f63-43f6-9ed8-4b444333a1d0/stm_sig.zip?language=fr
    url_env: STM_GIS_URL
    every_seconds: 86400
  - family: trip_updates
    format: gtfs-rt
    url: https://api.stm.info/pub/od/gtfs-rt/ic/v2/tripUpdates
    url_env: STM_RT_TRIP_UPDATES_URL
    auth: {header: apiKey, secret_env: STM_API_KEY}
    every_seconds: 30
  - family: vehicle_positions
    format: gtfs-rt
    url: https://api.stm.info/pub/od/gtfs-rt/ic/v2/vehiclePositions
    url_env: STM_RT_VEHICLE_POSITIONS_URL
    auth: {header: apiKey, secret_env: STM_API_KEY}
    every_seconds: 20
    # STM rebuilds at :08/:28/:48; capture two seconds later.
    phase_seconds: 10
  - family: alerts
    format: stm-etatservice-json
    url: https://api.stm.info/pub/od/i3/v2/messages/etatservice
    url_env: STM_I3_ALERTS_URL
    auth: {header: apiKey, secret_env: STM_API_KEY}
    every_seconds: 300

lines_without_live_data:
  - gap_id: metro_realtime
    route_types: [1]
    route_ids: []
    labels:
      en:
        short: 'Métro: real-time not available'
        long: >-
          The STM does not publish real-time data for the métro. Live
          indicators cover the bus network; métro interruptions appear in
          service alerts.
      fr:
        short: 'Métro : temps réel non disponible'
        long: >-
          La STM ne publie pas de données temps réel pour le métro. Les
          indicateurs en direct couvrent le réseau de bus; les interruptions
          de métro apparaissent dans les alertes de service.

map:
  basemap_url: /data/v1/stm/static/basemap/montreal.pmtiles
  basemap_bounds: [-75, 44.8, -72.5, 46.3]
  posters_url: /map/basemap-montreal-posters.json
overrides:
  bounds: [-74.1, 45.25, -73.2, 45.75]
  fit_bounds: [-73.9757, 45.4022, -73.4764, 45.7028]
  max_bounds: [-74.28605, 45.3, -73.16605, 45.82]
  geocode_context: Montréal, Québec
