# ─────────────────────────────────────────────────────────────────────────────
# OC Transpo — City of Ottawa transit (buses + O-Train light rail)
#
# Real provider manifest (validates against the current contract). Enrolled by the
# non-recursive config/providers/*.yaml glob.
#
# Geometry ships in shapes.txt (no separate GIS bundle). One static feed covers
# bus + O-Train — separate by route_type. Endpoints verified live against OC
# Transpo's Azure APIM developer portal (nextrip-public-api), 2026-06.
#
# NO SERVICE ALERTS FEED. The portal states "Service alerts is not available at
# this time." octranspo.com/en/alerts is a rider-facing HTML page, NOT a feed —
# do not scrape it. service_alerts is intentionally OMITTED so the provenance
# layer reports an honest null, not a data error. A static+RT provider is valid
# (only static_schedule is universally required).
#
# Operational: re-download the static GTFS DAILY (the Azure blob rotates
# ~midnight–2am EST) or RT trip_ids won't join stop_times.
# License: City of Ottawa Open Government Licence (revocable — keep attribution).
#
# Provision OCTRANSPO_API_KEY securely at deploy time; never inline it here.
# ─────────────────────────────────────────────────────────────────────────────

provider:
  provider_id: octranspo
  display_name: OC Transpo
  short_name: OC Transpo
  city: Ottawa
  # Measured 2026-11-09: 60 s rebuilds arrive 30–45 s late, with fixes 15 s older.
  live_source_lag_seconds: 60
  timezone: America/Toronto
  default_language: en
  default_currency: CAD
  bounds:
    # City of Ottawa
    min_latitude: 45.10
    max_latitude: 45.55
    min_longitude: -76.05
    max_longitude: -75.33
  attribution_text: Contains information licensed under the Open Government Licence – City of Ottawa.
  website_url: https://www.octranspo.com/
  is_active: true
  reading_population: vehicle_evidence

public:
  name_separators:
    ends: "<>"
    languages: "~"
    language_order: [en, fr]
  download_licence:
    checked_on: "2026-11-22"
    name:
      en: "Open Government Licence, City of Ottawa, v2.0"
      fr: "Licence du gouvernement ouvert, Ville d’Ottawa, version 2.0"
    attribution:
      en: "Contains information licensed under the Open Government Licence – City of Ottawa."
      fr: "Contient de l’information visée par la Licence du gouvernement ouvert – Ville d’Ottawa."
    url:
      en: "https://ottawa.ca/en/city-hall/open-transparent-and-accountable-government/open-data/open-data-licence-version-20"
      fr: "https://ottawa.ca/fr/hotel-de-ville/administration-ouverte-et-transparente-et-qui-rend-compte-de-ses-actes/donnees-ouvertes/version-20-de-la-licence-du-programme-de-donnees-ouvertes"
    limits:
      en: "The data is provided as is, without warranty, and may contain errors. The City reports that vehicle positions are unknown about 5% of the time."
      fr: "Les données sont fournies telles quelles, sans garantie, et peuvent contenir des erreurs. Selon la Ville, les positions des véhicules sont inconnues environ 5 % du temps."
    non_endorsement:
      en: "Transit is independent of STM, the City of Ottawa and OC Transpo. None of these organisations sponsors or endorses Transit."
      fr: "Transit est indépendant de la STM, de la Ville d’Ottawa et d’OC Transpo. Aucun de ces organismes ne commandite ni n’approuve Transit."
    source: {en: "OC Transpo", fr: "d’OC Transpo"}
  enabled: true
  labels:
    en: {city: Ottawa, operator: OC Transpo}
    fr: {city: Ottawa, operator: OC Transpo}
  fit_bounds:
    min_longitude: -75.95
    min_latitude: 45.20
    max_longitude: -75.43
    max_latitude: 45.55
  max_bounds:
    min_longitude: -76.15
    min_latitude: 45.10
    max_longitude: -75.24
    max_latitude: 45.65
  geocode_context: Ottawa, Ontario
  basemap_url: /data/v1/octranspo/static/basemap/ottawa.pmtiles
  basemap_bounds:
    min_longitude: -77.2
    min_latitude: 44.5
    max_longitude: -74.2
    max_latitude: 46.3
  posters_url: /map/basemap-ottawa-posters.json
  alert_links:
    en: https://www.octranspo.com/en/alerts/
    fr: https://www.octranspo.com/fr/alertes/

feeds:
  static_schedule:
    endpoint_key: static_schedule
    feed_kind: static_schedule
    source_format: gtfs_schedule_zip
    source_url: https://oct-gtfs-emasagcnfmcgeham.z01.azurefd.net/public-access/GTFSExport.zip
    source_url_env_var: OCTRANSPO_STATIC_GTFS_URL
    documentation_url: https://www.octranspo.com/en/plan-your-trip/travel-tools/developers/
    auth:
      auth_type: none
      notes: Keyless Azure Front Door blob (~105 MB). RE-DOWNLOAD DAILY — the blob rotates nightly. Geometry is in shapes.txt — no GIS feed.
    refresh_interval_seconds: 86400
    is_enabled: true

  trip_updates:
    endpoint_key: trip_updates
    feed_kind: trip_updates
    source_format: gtfs_rt_trip_updates
    source_url: https://nextrip-public-api.azure-api.net/octranspo/gtfs-rt-tp/beta/v1/TripUpdates
    source_url_env_var: OCTRANSPO_RT_TRIP_UPDATES_URL
    documentation_url: https://nextrip-public-api.developer.azure-api.net/
    auth:
      auth_type: api_key
      credential_env_var: OCTRANSPO_API_KEY
      auth_header_name: Ocp-Apim-Subscription-Key
      notes: Azure APIM subscription key (free registration).
    refresh_interval_seconds: 30
    is_enabled: true

  vehicle_positions:
    endpoint_key: vehicle_positions
    feed_kind: vehicle_positions
    source_format: gtfs_rt_vehicle_positions
    source_url: https://nextrip-public-api.azure-api.net/octranspo/gtfs-rt-vp/beta/v1/VehiclePositions
    source_url_env_var: OCTRANSPO_RT_VEHICLE_POSITIONS_URL
    documentation_url: https://nextrip-public-api.developer.azure-api.net/
    auth:
      auth_type: api_key
      credential_env_var: OCTRANSPO_API_KEY
      auth_header_name: Ocp-Apim-Subscription-Key
      notes: Same Azure APIM subscription key as trip_updates.
    refresh_interval_seconds: 20
    is_enabled: true

realtime:
  # OC Transpo's vehicle positions carry no occupancy, so room on board is not published.
  unpublished_vehicle_fields: [occupancy]
  lines_without_live_data:
    # O-Train lines 1, 2 and 4 are the only light-rail (route_type 0) routes in
    # routes.txt. Selecting by type survives the edition suffixes in route_ids.
    - gap_id: otrain_realtime
      route_types: [0]
